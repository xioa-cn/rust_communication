[package]
name = "s7-desktop-demo"
version = "0.1.0"
description = "Tauri + Vue demo for rs_appliaction"
edition = "2024"

[lib]
name = "s7_desktop_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serialport = { version = "4", default-features = false }
rs_appliaction = { path = "../.." }

[dev-dependencies]
serde_json = "1"
